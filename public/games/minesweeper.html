<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Classic Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .game-window {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      padding: 8px 14px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .digital {
      background: #000;
      color: #ef4444;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      min-width: 60px;
      text-align: center;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .face-btn:hover { background: #475569; }
    .grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 2px;
      border-radius: 4px;
      overflow: auto;
      max-height: 70vh;
    }
    .cell {
      width: 28px;
      height: 28px;
      background: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.05s;
    }
    .cell:hover { background: #64748b; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #dc2626; }
    .cell.flagged { color: #facc15; }
    .c1 { color: #38bdf8; }
    .c2 { color: #4ade80; }
    .c3 { color: #f87171; }
    .c4 { color: #818cf8; }
    .c5 { color: #fb923c; }
    .diff-select {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: center;
    }
    .diff-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .diff-btn.active { background: #3b82f6; color: #fff; font-weight: bold; }
    .hint { margin-top: 8px; font-size: 11px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="game-window">
    <div class="top-bar">
      <div class="digital" id="mineCount">010</div>
      <div class="face-btn" id="faceBtn">🙂</div>
      <div class="digital" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="diff-select">
      <button class="diff-btn active" data-r="9" data-c="9" data-m="10">Beginner (9x9)</button>
      <button class="diff-btn" data-r="16" data-c="16" data-m="40">Intermediate (16x16)</button>
    </div>
  </div>
  <div class="hint">Left Click to Reveal • Right Click (or Long Press) to Flag</div>

  <script>
    let ROWS = 9, COLS = 9, MINES = 10;
    let board = [];
    let state = 'ready'; // ready, playing, won, lost
    let timer = 0;
    let timerInterval = null;
    let flaggedCount = 0;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceBtn = document.getElementById('faceBtn');

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timer = 0;
      timerEl.textContent = '000';
      timerInterval = setInterval(() => {
        timer = Math.min(999, timer + 1);
        timerEl.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function init() {
      stopTimer();
      state = 'ready';
      faceBtn.textContent = '🙂';
      timerEl.textContent = '000';
      flaggedCount = 0;
      mineCountEl.textContent = String(MINES).padStart(3, '0');

      gridEl.style.gridTemplateColumns = `repeat(${COLS}, 28px)`;
      gridEl.innerHTML = '';

      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.r = r;
          cellEl.dataset.c = c;

          cellEl.addEventListener('click', () => handleClick(r, c));
          cellEl.addEventListener('contextmenu', e => {
            e.preventDefault();
            handleRightClick(r, c);
          });

          gridEl.appendChild(cellEl);

          board[r][c] = {
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: cellEl
          };
        }
      }
    }

    function plantMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (!board[r][c].mine && !(Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) {
          board[r][c].mine = true;
          placed++;
        }
      }

      // Count adjacent mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                  count++;
                }
              }
            }
            board[r][c].count = count;
          }
        }
      }
    }

    function handleClick(r, c) {
      if (state === 'won' || state === 'lost') return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'ready') {
        state = 'playing';
        plantMines(r, c);
        startTimer();
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.mine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        gameOver(false);
        return;
      }

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add('c' + Math.min(5, cell.count));
      } else {
        // Flood fill
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              if (!board[nr][nc].revealed) reveal(nr, nc);
            }
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (state !== 'playing' && state !== 'ready') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.classList.toggle('flagged', cell.flagged);
      cell.el.textContent = cell.flagged ? '🚩' : '';

      flaggedCount += cell.flagged ? 1 : -1;
      mineCountEl.textContent = String(Math.max(0, MINES - flaggedCount)).padStart(3, '0');
    }

    function checkWin() {
      if (state !== 'playing') return;
      let unrevealed = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].revealed) unrevealed++;
        }
      }
      if (unrevealed === MINES) {
        gameOver(true);
      }
    }

    function gameOver(win) {
      state = win ? 'won' : 'lost';
      stopTimer();
      faceBtn.textContent = win ? '😎' : '😵';

      // Reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine && !board[r][c].revealed) {
            board[r][c].el.classList.add('revealed');
            board[r][c].el.textContent = win ? '🚩' : '💣';
          }
        }
      }
    }

    faceBtn.onclick = init;

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ROWS = parseInt(btn.dataset.r);
        COLS = parseInt(btn.dataset.c);
        MINES = parseInt(btn.dataset.m);
        init();
      };
    });

    init();
  </script>
</body>
</html>
