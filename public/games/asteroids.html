<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asteroids Vector 1979</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050508;
      color: #38bdf8;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 580px;
      max-width: 95vw;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: bold;
    }
    #canvas {
      background: #020205;
      border: 1px solid #1e293b;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
      max-width: 95vw;
      max-height: 75vh;
      display: block;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score" style="color:#fff;">0</span></div>
    <div>SHIPS: <span id="lives" style="color:#f43f5e;">▲▲▲</span></div>
    <div>WAVE: <span id="wave" style="color:#eab308;">1</span></div>
  </div>

  <canvas id="canvas" width="600" height="460"></canvas>
  <div class="hint">Arrows / WASD: Rotate & Thrust • Space: Fire Laser • Shift: Hyperspace</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');

    let score = 0;
    let lives = 3;
    let wave = 1;
    let gameOver = false;

    const ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 12,
      a: -Math.PI / 2,
      rot: 0,
      thrusting: false,
      thrust: { x: 0, y: 0 },
      invulnerable: 120
    };

    let lasers = [];
    let asteroids = [];
    let particles = [];

    function playTone(freq, dur, type='square') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function createAsteroid(x, y, r, level = 3) {
      const vert = Math.floor(Math.random() * 5) + 7;
      const offs = [];
      for (let i = 0; i < vert; i++) {
        offs.push(Math.random() * 0.4 + 0.8);
      }
      return {
        x, y,
        xv: (Math.random() - 0.5) * (4 - level + 1.2),
        yv: (Math.random() - 0.5) * (4 - level + 1.2),
        r,
        a: Math.random() * Math.PI * 2,
        rotSpd: (Math.random() - 0.5) * 0.05,
        vert,
        offs,
        level
      };
    }

    function spawnAsteroids(count) {
      asteroids = [];
      for (let i = 0; i < count; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 120);
        asteroids.push(createAsteroid(x, y, 36, 3));
      }
    }

    function shootLaser() {
      if (lasers.length < 8 && !gameOver) {
        lasers.push({
          x: ship.x + ship.r * Math.cos(ship.a),
          y: ship.y + ship.r * Math.sin(ship.a),
          xv: Math.cos(ship.a) * 9,
          yv: Math.sin(ship.a) * 9,
          life: 55
        });
        playTone(850, 0.04);
      }
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') { e.preventDefault(); shootLaser(); }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        // Hyperspace
        ship.x = Math.random() * canvas.width;
        ship.y = Math.random() * canvas.height;
        ship.thrust = { x: 0, y: 0 };
        playTone(300, 0.2);
      }
      if (gameOver && e.code === 'Space') restart();
    });

    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function restart() {
      score = 0;
      lives = 3;
      wave = 1;
      gameOver = false;
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.thrust = { x: 0, y: 0 };
      ship.a = -Math.PI / 2;
      ship.invulnerable = 120;
      scoreEl.textContent = score;
      livesEl.textContent = '▲▲▲';
      waveEl.textContent = wave;
      spawnAsteroids(4);
    }

    function addExplosion(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1
        });
      }
    }

    function update() {
      if (gameOver) return;

      // Ship rotation
      if (keys['ArrowLeft'] || keys['KeyA']) ship.a -= 0.07;
      if (keys['ArrowRight'] || keys['KeyD']) ship.a += 0.07;

      // Thrust
      if (keys['ArrowUp'] || keys['KeyW']) {
        ship.thrust.x += Math.cos(ship.a) * 0.18;
        ship.thrust.y += Math.sin(ship.a) * 0.18;
        ship.thrusting = true;
        if (Math.random() > 0.4) {
          particles.push({
            x: ship.x - ship.r * Math.cos(ship.a),
            y: ship.y - ship.r * Math.sin(ship.a),
            vx: -Math.cos(ship.a) * 2 + (Math.random() - 0.5),
            vy: -Math.sin(ship.a) * 2 + (Math.random() - 0.5),
            life: 0.6
          });
        }
      } else {
        ship.thrust.x *= 0.985;
        ship.thrust.y *= 0.985;
        ship.thrusting = false;
      }

      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Ship wrapping
      if (ship.x < 0) ship.x = canvas.width;
      else if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      else if (ship.y > canvas.height) ship.y = 0;

      if (ship.invulnerable > 0) ship.invulnerable--;

      // Lasers
      lasers.forEach(l => {
        l.x += l.xv;
        l.y += l.yv;
        l.life--;
        if (l.x < 0) l.x = canvas.width; else if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height; else if (l.y > canvas.height) l.y = 0;
      });
      lasers = lasers.filter(l => l.life > 0);

      // Asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.xv;
        a.y += a.yv;
        a.a += a.rotSpd;

        if (a.x < -a.r) a.x = canvas.width + a.r;
        else if (a.x > canvas.width + a.r) a.x = -a.r;
        if (a.y < -a.r) a.y = canvas.height + a.r;
        else if (a.y > canvas.height + a.r) a.y = -a.r;

        // Laser collision
        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(j, 1);
            addExplosion(a.x, a.y, 14);
            playTone(160 + a.level * 80, 0.1);

            score += (4 - a.level) * 20;
            scoreEl.textContent = score;

            if (a.level > 1) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 1.7, a.level - 1));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 1.7, a.level - 1));
            }
            asteroids.splice(i, 1);
            break;
          }
        }

        // Ship collision
        if (ship.invulnerable <= 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r * 0.8) {
          lives--;
          livesEl.textContent = '▲'.repeat(Math.max(0, lives));
          addExplosion(ship.x, ship.y, 25);
          playTone(100, 0.4, 'sawtooth');
          if (lives <= 0) {
            gameOver = true;
          } else {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.thrust = { x: 0, y: 0 };
            ship.invulnerable = 120;
          }
        }
      }

      // Next wave
      if (asteroids.length === 0) {
        wave++;
        waveEl.textContent = wave;
        spawnAsteroids(3 + wave);
      }

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
      });
      particles = particles.filter(p => p.life > 0);
    }

    function draw() {
      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw asteroids
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.a);
        ctx.beginPath();
        for (let j = 0; j < a.vert; j++) {
          const angle = (j / a.vert) * Math.PI * 2;
          const rad = a.r * a.offs[j];
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (j === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      });

      // Draw lasers
      ctx.fillStyle = '#38bdf8';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#38bdf8';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Draw ship
      if (!gameOver && (ship.invulnerable === 0 || Math.floor(ship.invulnerable / 10) % 2 === 0)) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.a);
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ship.r, 0);
        ctx.lineTo(-ship.r * 0.8, -ship.r * 0.7);
        ctx.lineTo(-ship.r * 0.4, 0);
        ctx.lineTo(-ship.r * 0.8, ship.r * 0.7);
        ctx.closePath();
        ctx.stroke();

        // Thrust flame
        if (ship.thrusting) {
          ctx.strokeStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(-ship.r * 0.4, 0);
          ctx.lineTo(-ship.r * 1.3, 0);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Particles
      ctx.fillStyle = '#f8fafc';
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
      ctx.globalAlpha = 1.0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(2, 2, 5, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#fff';
        ctx.font = '14px Courier New';
        ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    restart();
    loop();
  </script>
</body>
</html>
