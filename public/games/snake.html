<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake Neon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0d14;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      padding: 10px 16px;
      background: #111726;
      border: 1px solid #1e293b;
      border-radius: 8px 8px 0 0;
      font-size: 15px;
      font-weight: bold;
    }
    .hud span { color: #fff; }
    .hud .score-val { color: #00ffcc; }
    .hud .high-val { color: #ff007f; }
    #canvas {
      background: #060911;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
      display: block;
      max-width: 95vw;
      max-height: 70vh;
      image-rendering: pixelated;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 13, 20, 0.88);
      backdrop-filter: blur(4px);
      width: 480px;
      height: 480px;
      max-width: 95vw;
      border: 2px solid #ff007f;
      border-radius: 8px;
    }
    .overlay h2 {
      color: #ff007f;
      font-size: 28px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #ff007f;
    }
    .overlay p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .btn {
      background: linear-gradient(135deg, #00ffcc, #0284c7);
      color: #040914;
      font-weight: bold;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #00ffcc; }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span class="score-val" id="score">0</span></div>
    <div>BEST: <span class="high-val" id="highScore">0</span></div>
    <div>SPEED: <span id="speed">1x</span></div>
  </div>
  <div style="position: relative;">
    <canvas id="canvas" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">RETRO SNAKE</h2>
      <p id="overlaySub">Press Space or Start to Play</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>
  </div>
  <div class="controls-hint">Use Arrow Keys / WASD • Space to Pause</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const GRID = 24;
    const TILE = canvas.width / GRID; // 20px

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 12 };
    let superFood = null;
    let superFoodTimer = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high') || '0', 10);
    let gameState = 'start'; // start, playing, paused, over
    let lastTime = 0;
    let moveInterval = 110;
    let accumTime = 0;

    highScoreEl.textContent = highScore;

    function playTone(freq, duration, type='sine') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 8, y: 12 },
        { x: 7, y: 12 },
        { x: 6, y: 12 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      moveInterval = 110;
      scoreEl.textContent = '0';
      speedEl.textContent = '1x';
      spawnFood();
      gameState = 'playing';
      overlay.style.display = 'none';
      playTone(440, 0.1);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
      if (Math.random() < 0.25 && !superFood) {
        superFood = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
        superFoodTimer = 60;
      }
    }

    function update() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat normal food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        playTone(587.33, 0.08, 'triangle');
        if (score % 50 === 0 && moveInterval > 65) {
          moveInterval -= 6;
          speedEl.textContent = (110 / moveInterval).toFixed(1) + 'x';
        }
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_high', highScore);
        }
        spawnFood();
      } else if (superFood && head.x === superFood.x && head.y === superFood.y) {
        score += 50;
        playTone(880, 0.18, 'square');
        superFood = null;
        scoreEl.textContent = score;
      } else {
        snake.pop();
      }

      if (superFood) {
        superFoodTimer--;
        if (superFoodTimer <= 0) superFood = null;
      }
    }

    function gameOver() {
      gameState = 'over';
      playTone(150, 0.35, 'sawtooth');
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ff0055';
      overlaySub.textContent = 'Final Score: ' + score;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#060911';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#0e1726';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * TILE, 0);
        ctx.lineTo(i * TILE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * TILE);
        ctx.lineTo(canvas.width, i * TILE);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#00ffcc';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ffcc';
      ctx.beginPath();
      ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Super food
      if (superFood) {
        ctx.fillStyle = '#ff007f';
        ctx.shadowColor = '#ff007f';
        ctx.beginPath();
        ctx.arc(superFood.x * TILE + TILE / 2, superFood.y * TILE + TILE / 2, TILE / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#38bdf8';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#38bdf8';
        } else {
          const ratio = 1 - (index / snake.length) * 0.5;
          ctx.fillStyle = `rgba(0, 255, 204, ${ratio})`;
          ctx.shadowBlur = 6;
          ctx.shadowColor = '#00ffcc';
        }
        ctx.fillRect(part.x * TILE + 2, part.y * TILE + 2, TILE - 4, TILE - 4);
      });
      ctx.shadowBlur = 0;
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      if (gameState === 'playing') {
        accumTime += delta;
        if (accumTime >= moveInterval) {
          accumTime = 0;
          update();
        }
      }
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) nextDir = { x: 1, y: 0 };
      else if (e.code === 'Space') {
        if (gameState === 'start' || gameState === 'over') initGame();
        else if (gameState === 'playing') gameState = 'paused';
        else if (gameState === 'paused') gameState = 'playing';
      }
    });

    startBtn.addEventListener('click', initGame);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
