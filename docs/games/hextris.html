<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hextris Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b0f19;
      color: #38bdf8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 440px;
      max-width: 95vw;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: bold;
    }
    #canvas {
      background: #04060c;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      max-width: 95vw;
      max-height: 75vh;
      display: block;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score" style="color:#fff;">0</span></div>
    <div>MULTIPLIER: <span id="combo" style="color:#f59e0b;">1x</span></div>
    <div>BEST: <span id="best" style="color:#22c55e;">0</span></div>
  </div>

  <canvas id="canvas" width="440" height="440"></canvas>
  <div class="hint">Left/Right Arrows or Click Left/Right halves to rotate Hexagon</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const bestEl = document.getElementById('best');

    const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];
    const HEX_RADIUS = 50;
    const SIDES = 6;

    let score = 0;
    let combo = 1;
    let best = parseInt(localStorage.getItem('hextris_best') || '0', 10);
    bestEl.textContent = best;

    let hexAngle = 0; // 0 to 5
    let targetAngle = 0;
    let rotation = 0;

    let blocks = [[], [], [], [], [], []]; // 6 sides
    let falling = [];
    let spawnTimer = 0;
    let spawnRate = 90;
    let gameOver = false;

    function playTone(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function init() {
      score = 0;
      combo = 1;
      blocks = [[], [], [], [], [], []];
      falling = [];
      spawnRate = 90;
      hexAngle = 0;
      targetAngle = 0;
      rotation = 0;
      gameOver = false;
      scoreEl.textContent = '0';
      comboEl.textContent = '1x';
    }

    function rotate(dir) {
      targetAngle += dir * (Math.PI / 3);
      playTone(400, 0.04);
    }

    window.addEventListener('keydown', e => {
      if (gameOver) {
        if (e.code === 'Space') init();
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') rotate(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rotate(1);
    });

    canvas.addEventListener('click', e => {
      if (gameOver) { init(); return; }
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width / 2) rotate(-1);
      else rotate(1);
    });

    function spawnBlock() {
      const side = Math.floor(Math.random() * SIDES);
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      falling.push({
        side,
        color,
        dist: 220,
        speed: 2.2 + (score / 400)
      });
    }

    function checkMatches() {
      for (let s = 0; s < SIDES; s++) {
        const col = blocks[s];
        for (let i = 0; i <= col.length - 3; i++) {
          if (col[i] === col[i+1] && col[i] === col[i+2]) {
            // Match found!
            const count = 3;
            col.splice(i, 3);
            score += 30 * combo;
            combo++;
            comboEl.textContent = combo + 'x';
            scoreEl.textContent = score;
            playTone(600 + combo * 50, 0.15);
            if (score > best) {
              best = score;
              bestEl.textContent = best;
              localStorage.setItem('hextris_best', best);
            }
            return checkMatches(); // recheck
          }
        }
      }
    }

    function update() {
      if (gameOver) return;

      // Smooth rotation
      rotation += (targetAngle - rotation) * 0.25;

      spawnTimer++;
      if (spawnTimer >= spawnRate) {
        spawnTimer = 0;
        spawnBlock();
        if (spawnRate > 45) spawnRate -= 0.5;
      }

      // Falling bars
      for (let i = falling.length - 1; i >= 0; i--) {
        const f = falling[i];
        f.dist -= f.speed;

        // Current target side taking rotation into account
        const angleDiff = (rotation % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        const shift = Math.round(angleDiff / (Math.PI / 3)) % 6;
        const currentSide = (f.side - shift + 6) % 6;

        const stackHeight = blocks[currentSide].length * 14;
        const targetDist = HEX_RADIUS + stackHeight;

        if (f.dist <= targetDist) {
          // Lands
          blocks[currentSide].push(f.color);
          falling.splice(i, 1);
          playTone(280, 0.05);

          if (blocks[currentSide].length >= 8) {
            gameOver = true;
            playTone(150, 0.4);
          } else {
            checkMatches();
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#04060c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.save();
      ctx.translate(cx, cy);

      // Draw incoming falling blocks
      falling.forEach(f => {
        const a = f.side * (Math.PI / 3);
        const nextA = (f.side + 1) * (Math.PI / 3);

        const x1 = Math.cos(a) * f.dist;
        const y1 = Math.sin(a) * f.dist;
        const x2 = Math.cos(nextA) * f.dist;
        const y2 = Math.sin(nextA) * f.dist;

        ctx.strokeStyle = f.color;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      });
      ctx.shadowBlur = 0;

      // Draw rotated center and stacked blocks
      ctx.rotate(rotation);

      // Stacked blocks
      for (let s = 0; s < SIDES; s++) {
        const col = blocks[s];
        const a1 = s * (Math.PI / 3);
        const a2 = (s + 1) * (Math.PI / 3);

        col.forEach((color, idx) => {
          const d = HEX_RADIUS + idx * 14 + 7;
          const x1 = Math.cos(a1) * d;
          const y1 = Math.sin(a1) * d;
          const x2 = Math.cos(a2) * d;
          const y2 = Math.sin(a2) * d;

          ctx.strokeStyle = color;
          ctx.lineWidth = 11;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        });
      }

      // Center hexagon
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * (Math.PI / 3);
        const x = Math.cos(a) * HEX_RADIUS;
        const y = Math.sin(a) * HEX_RADIUS;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();

      if (gameOver) {
        ctx.fillStyle = 'rgba(4, 6, 12, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('HEXAGON OVERFLOW', cx, cy - 10);
        ctx.fillStyle = '#fff';
        ctx.font = '14px system-ui';
        ctx.fillText('Click to Try Again', cx, cy + 25);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
