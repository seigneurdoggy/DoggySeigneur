<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope 3D Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060814;
      color: #38bdf8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 500px;
      max-width: 95vw;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
    }
    .hud span { color: #f8fafc; }
    #canvas {
      background: #02040a;
      border: 2px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
      max-width: 95vw;
      max-height: 75vh;
      display: block;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>DISTANCE: <span id="dist">0</span>m</div>
    <div>SPEED: <span id="speed">1.0</span>x</div>
    <div>BEST: <span id="best" style="color: #f59e0b;">0</span>m</div>
  </div>

  <canvas id="canvas" width="500" height="420"></canvas>
  <div class="hint">Use A/D or Left/Right Arrow Keys or Mouse to steer • Dodge Red Blocks!</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const distEl = document.getElementById('dist');
    const speedEl = document.getElementById('speed');
    const bestEl = document.getElementById('best');

    let dist = 0;
    let speed = 1.0;
    let best = parseInt(localStorage.getItem('slope_best') || '0', 10);
    let state = 'start'; // start, play, over

    bestEl.textContent = best;

    let ballX = 0; // -1 to 1
    let ballSpeed = 0;
    let obstacles = [];
    let horizonY = 80;
    let groundBottomY = canvas.height;
    let cameraZ = 0;

    function playTone(freq, dur, type='sine') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function spawnObstacle(z) {
      const lane = (Math.random() - 0.5) * 1.6;
      obstacles.push({
        x: lane,
        z: z,
        w: 0.35 + Math.random() * 0.25,
        h: 0.5,
        color: '#ef4444'
      });
    }

    function initGame() {
      dist = 0;
      speed = 1.0;
      ballX = 0;
      ballSpeed = 0;
      cameraZ = 0;
      obstacles = [];
      for (let z = 20; z < 180; z += 16) {
        spawnObstacle(z);
      }
      state = 'play';
      playTone(440, 0.1);
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space' && (state === 'start' || state === 'over')) {
        initGame();
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('mousemove', e => {
      if (state !== 'play') return;
      const rect = canvas.getBoundingClientRect();
      const norm = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ballX = Math.max(-0.95, Math.min(0.95, norm));
    });

    canvas.addEventListener('click', () => {
      if (state === 'start' || state === 'over') initGame();
    });

    function project(x, y, z) {
      if (z <= 0.1) return null;
      const scale = 180 / z;
      const px = canvas.width / 2 + x * scale * 120;
      const py = horizonY + (1 - y) * scale * 45;
      return { px, py, scale };
    }

    function update() {
      if (state === 'play') {
        const steer = 0.035;
        if (keys['ArrowLeft'] || keys['KeyA']) ballX -= steer;
        if (keys['ArrowRight'] || keys['KeyD']) ballX += steer;
        ballX = Math.max(-0.95, Math.min(0.95, ballX));

        dist += Math.floor(speed * 2);
        distEl.textContent = dist;
        speed += 0.0003;
        speedEl.textContent = speed.toFixed(2);

        if (dist > best) {
          best = dist;
          bestEl.textContent = best;
          localStorage.setItem('slope_best', best);
        }

        cameraZ += speed * 0.45;

        // Check obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          const relZ = obs.z - cameraZ;

          // Collision check near player (relZ ~ 4)
          if (relZ > 0.8 && relZ < 3.2) {
            const hitMargin = obs.w / 2 + 0.12;
            if (Math.abs(ballX - obs.x) < hitMargin) {
              // Crash
              state = 'over';
              playTone(140, 0.4, 'sawtooth');
            }
          }

          if (relZ < -2) {
            obstacles.splice(i, 1);
            spawnObstacle(cameraZ + 160 + Math.random() * 20);
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sky grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(canvas.width / 2, horizonY);
        ctx.stroke();
      }

      // Ground plane
      const grad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
      grad.addColorStop(0, '#090d1a');
      grad.addColorStop(1, '#02050e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

      // Perspective grid lines
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      for (let lane = -1.2; lane <= 1.21; lane += 0.4) {
        const topP = project(lane, 0, 160);
        const botP = project(lane, 0, 1.2);
        if (topP && botP) {
          ctx.beginPath();
          ctx.moveTo(topP.px, topP.py);
          ctx.lineTo(botP.px, botP.py);
          ctx.stroke();
        }
      }

      // Horizontal ground bars
      const zOffset = cameraZ % 6;
      for (let z = 6 - zOffset; z < 140; z += 6) {
        const p1 = project(-1.2, 0, z);
        const p2 = project(1.2, 0, z);
        if (p1 && p2) {
          ctx.strokeStyle = `rgba(56, 189, 248, ${Math.max(0.05, 1 - z / 120)})`;
          ctx.beginPath();
          ctx.moveTo(p1.px, p1.py);
          ctx.lineTo(p2.px, p2.py);
          ctx.stroke();
        }
      }

      // Draw obstacles (sorted far to near)
      const sorted = [...obstacles].sort((a, b) => b.z - a.z);
      sorted.forEach(obs => {
        const relZ = obs.z - cameraZ;
        if (relZ > 0.5 && relZ < 150) {
          const p = project(obs.x, 0, relZ);
          if (p) {
            const w = obs.w * p.scale * 120;
            const h = obs.h * p.scale * 60;
            const alpha = Math.min(1, Math.max(0.1, 1 - relZ / 140));

            ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = relZ < 25 ? 12 : 2;
            ctx.fillRect(p.px - w / 2, p.py - h, w, h);
            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = 1;
            ctx.strokeRect(p.px - w / 2, p.py - h, w, h);
          }
        }
      });
      ctx.shadowBlur = 0;

      // Draw player sphere (relZ = 2)
      const pBall = project(ballX, 0, 2);
      if (pBall) {
        const r = 16;
        ctx.fillStyle = '#06b6d4';
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(pBall.px, pBall.py - r, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pBall.px - 4, pBall.py - r - 4, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Overlays
      if (state === 'start') {
        ctx.fillStyle = 'rgba(2, 4, 10, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('SLOPE 3D RUNNER', canvas.width / 2, 180);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px system-ui';
        ctx.fillText('Steer clear of neon obstacles', canvas.width / 2, 215);
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('Click or Press Space to Play', canvas.width / 2, 260);
      } else if (state === 'over') {
        ctx.fillStyle = 'rgba(2, 4, 10, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 26px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, 170);
        ctx.fillStyle = '#fff';
        ctx.font = '16px system-ui';
        ctx.fillText('Distance: ' + dist + 'm', canvas.width / 2, 210);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '14px system-ui';
        ctx.fillText('Click to Try Again', canvas.width / 2, 260);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
